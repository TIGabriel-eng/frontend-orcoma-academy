<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Streak Modal - Leão de Fogo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<button id="openBtn">
  🔥 Concluir lição
</button>

<div class="overlay" id="streakOverlay">
  <div class="card">
    <button class="close-x">✕</button>

    <div class="stage">
      <div class="glow"></div>
      <div class="flames">
        <div class="flame f2"></div>
        <div class="flame f3"></div>
        <div class="flame f1"></div>
      </div>
      <div class="spark"></div>
      <div class="spark"></div>
      <div class="spark"></div>
      <div class="spark"></div>

      <div class="lion-wrap">
        <svg viewBox="0 0 100 100" width="120" height="120">
          <!-- juba -->
          <circle cx="50" cy="48" r="34" fill="#c2570f"/>
          <circle cx="50" cy="48" r="34" fill="url(#maneGrad)" opacity="0.5"/>
          <!-- rosto -->
          <circle cx="50" cy="50" r="22" fill="#f2a83d"/>
          <!-- focinho -->
          <ellipse cx="50" cy="60" rx="11" ry="8" fill="#fdeec9"/>
          <circle cx="50" cy="60" r="2.6" fill="#3a1505"/>
          <path d="M44 64 Q50 68 56 64" stroke="#3a1505" stroke-width="1.8" fill="none" stroke-linecap="round"/>
          <!-- olhos -->
          <circle cx="42" cy="48" r="2.6" fill="#3a1505"/>
          <circle cx="58" cy="48" r="2.6" fill="#3a1505"/>
          <path d="M37 43 Q41 40 45 43" stroke="#7a3a10" stroke-width="2" fill="none" stroke-linecap="round"/>
          <path d="M55 43 Q59 40 63 43" stroke="#7a3a10" stroke-width="2" fill="none" stroke-linecap="round"/>
          <!-- orelhas -->
          <circle cx="32" cy="32" r="6.5" fill="#c2570f"/>
          <circle cx="68" cy="32" r="6.5" fill="#c2570f"/>
          <circle cx="32" cy="32" r="3.2" fill="#f2a83d"/>
          <circle cx="68" cy="32" r="3.2" fill="#f2a83d"/>
          <defs>
            <radialGradient id="maneGrad" cx="50%" cy="50%" r="50%">
              <stop offset="60%" stop-color="#ff8c1a"/>
              <stop offset="100%" stop-color="#e8401c"/>
            </radialGradient>
          </defs>
        </svg>
      </div>
    </div>

    <h2 class="title">Parabéns! 🎉</h2>
    <div class="streak-number">1</div>
    <div class="streak-label">dia de sequência</div>
    <p class="msg">Você manteve o fogo aceso hoje! Volte amanhã para não deixar sua sequência apagar.</p>

    <button class="continue-btn">
      Continuar
    </button>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
