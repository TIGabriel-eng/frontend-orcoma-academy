<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-Content-Type-Options" content="nosniff" />
  <meta http-equiv="X-Frame-Options" content="SAMEORIGIN" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <title>Orcoma Academy | Play</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="../responsive.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body>

<div class="shell">

  <!-- ── SIDEBAR ── -->
  <aside class="sidebar" id="sidebar" aria-label="Menu do curso">
    <div class="sidebar-logo">
      <a href="../orcoma-business/index.html" aria-label="Voltar ao início">
        <img src="../assets/images/LOGO ORCOMA ACADEMY.png" alt="Orcoma Academy" class="sidebar__logo-img" />
      </a>
    </div>

    <div class="sidebar-course-title" id="sidebarCourseTitle">Carregando...</div>

    <nav aria-label="Módulos do curso" id="modulesNav">
    </nav>
  </aside>

  <!-- ── MAIN ── -->
  <main class="main" id="main-content">

    <button class="topbar__menu-btn" id="menuToggle" aria-label="Abrir menu">
      <i class="fa-solid fa-bars"></i>
    </button>

    <!-- VIDEO + CHAT ROW -->
    <div class="content-row">

      <!-- VIDEO COLUMN -->
      <div class="video-col">

        <!-- VIDEO -->
        <div class="video-wrapper">
          <iframe
            id="course-video"
            src=""
            title="Vídeo da aula"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
            allowfullscreen
            loading="lazy"
            sandbox="allow-scripts allow-same-origin"
          ></iframe>
          <div class="video-share-blocker" aria-hidden="true"></div>
          <div class="video-share-blocker-left" aria-hidden="true"></div>
          <!-- Curso Concluído Overlay -->
          <div class="curso-concluido-overlay" id="cursoConcluidoOverlay" aria-hidden="true">
            <div class="curso-concluido-badge">
              <div class="curso-concluido-badge__icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
              </div>
              <span class="curso-concluido-badge__text">Curso Concluído</span>
            </div>
          </div>
        </div>
        <!-- VIDEO META -->
        <div class="video-meta">
          <h1 id="lesson-title">Carregando aula...</h1>
          <p id="lesson-meta">Aguarde...</p>
        </div>

        <!-- RATING BAR -->
        <div class="rating-bar">
          <div class="stars-display" id="starsDisplay">
            <span class="star lit">★</span>
            <span class="star lit">★</span>
            <span class="star lit">★</span>
            <span class="star lit">★</span>
            <span class="star">★</span>
          </div>
          <span class="rating-label" id="ratingLabel"><strong>0/5</strong></span>
          <div class="rating-divider" aria-hidden="true"></div>
          <button class="review-toggle" onclick="toggleReview()" aria-expanded="false" aria-controls="panel-reviews">Avaliar</button>
        </div>

        <!-- TABS -->
        <div class="tabs" role="tablist">
          <button class="tab-btn active" role="tab" aria-selected="true" aria-controls="panel-resources" onclick="switchTab(this,'panel-resources')">Materiais</button>
          <button class="tab-btn" role="tab" aria-selected="false" aria-controls="panel-notes" onclick="switchTab(this,'panel-notes')">Anotações</button>
          <button class="tab-btn" role="tab" aria-selected="false" aria-controls="panel-about" onclick="switchTab(this,'panel-about')">Sobre o Curso</button>
          <button class="tab-btn" role="tab" aria-selected="false" aria-controls="panel-reviews" onclick="switchTab(this,'panel-reviews')">Avaliações e Comentários</button>
        </div>

        <!-- TAB: MATERIALS -->
        <div class="tab-panel active" id="panel-resources" role="tabpanel">
          <div class="resource-list" id="materialsList">
          </div>
        </div>

        <!-- TAB: NOTES -->
        <div class="tab-panel" id="panel-notes" role="tabpanel">
          <textarea
            class="notes-area"
            id="notes-area"
            placeholder="Suas anotações sobre esta aula ficam aqui..."
            aria-label="Campo de anotações da aula"
            maxlength="4000"
          ></textarea>
          <button class="notes-save" onclick="saveNotes()">Salvar anotações</button>
        </div>

        <!-- TAB: ABOUT -->
        <div class="tab-panel" id="panel-about" role="tabpanel">
          <div id="aboutContent"></div>
        </div>

        <!-- TAB: AVALIAÇÕES E COMENTÁRIOS -->
        <div class="tab-panel" id="panel-reviews" role="tabpanel">
          <div class="review-composer">
            <div class="review-composer__stars">
              <span class="star" onclick="setComposerRating(1)" role="button" tabindex="0" aria-label="1 estrela">★</span>
              <span class="star" onclick="setComposerRating(2)" role="button" tabindex="0" aria-label="2 estrelas">★</span>
              <span class="star" onclick="setComposerRating(3)" role="button" tabindex="0" aria-label="3 estrelas">★</span>
              <span class="star" onclick="setComposerRating(4)" role="button" tabindex="0" aria-label="4 estrelas">★</span>
              <span class="star" onclick="setComposerRating(5)" role="button" tabindex="0" aria-label="5 estrelas">★</span>
            </div>
            <textarea class="review-composer__textarea" id="composer-text" placeholder="Escreva seu comentário e avaliação sobre este módulo..." aria-label="Campo de comentário da avaliação" maxlength="2000"></textarea>
            <div class="review-composer__footer">
              <button class="post-btn" onclick="postComposerReview()">Postar avaliação</button>
            </div>
          </div>
          <div class="reviews-list" id="reviewsList">
            <!-- reviews are loaded dynamically via carregarReviews() -->
          </div>
        </div>

      </div><!-- /video-col -->

    </div><!-- /content-row -->

  </main>

  <div id="lessonToast" class="lesson-toast" aria-live="polite" aria-atomic="true">Etapa Concluída!</div>

  <div class="sidebar__overlay" id="sidebarOverlay"></div>
</div>

<script src="../auth.js"></script>
<script src="../api.js"></script>
<script src="../router.js"></script>
<script src="../plan-expiry-banner.js"></script>
<script src="../onboarding.js"></script>
<script src="https://www.youtube.com/iframe_api"></script>
<script src="https://player.vimeo.com/api/player.js"></script>
<script src="script.js"></script>

  <!-- Course Complete Modal -->
  <div class="overlay" id="courseCompleteOverlay" aria-hidden="true">
    <div class="card course-complete-card">
      <button class="close-x" id="courseCompleteClose">✕</button>
      <h2 class="title">🎉 Parabéns!</h2>
      <p class="course-complete-message">Você concluiu este curso!</p>
      <div class="course-complete-actions">
        <button class="continue-btn" id="courseCompleteReview">Revisar Aula</button>
        <button class="continue-btn" id="courseCompleteBack">Voltar aos Cursos</button>
        <button class="continue-btn" id="courseCompleteNext">Próximo Curso</button>
      </div>
    </div>
  </div>

  <!-- Widget Checklist -->
  <div class="checklist-widget" id="checklistWidget">
    <div class="checklist-widget__panel" id="checklistPanel">
      <div class="checklist-widget__panel-header">
        <h4><i class="fa-regular fa-lightbulb"></i> Metas do Dia</h4>
        <button class="checklist-widget__close" id="checklistClose">&times;</button>
      </div>
      <div class="checklist-widget__list">
        <div class="checklist-widget__item">
          <input type="checkbox" id="ck1" disabled />
          <label for="ck1">Assista uma aula completa</label>
        </div>
        <div class="checklist-widget__item">
          <input type="checkbox" id="ck2" disabled />
          <label for="ck2">Baixe 1 material de apoio</label>
        </div>
        <div class="checklist-widget__item">
          <input type="checkbox" id="ck3" disabled />
          <label for="ck3">Responda ao fórum da aula</label>
        </div>
        <div class="checklist-widget__item">
          <input type="checkbox" id="ck4" disabled />
          <label for="ck4">Marque 1 curso como favorito</label>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
