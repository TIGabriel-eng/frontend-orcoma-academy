<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Orcoma Academy</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="../responsive.css" />
</head>
<body>

  <script src="script.js"></script>

  <!-- Widget Checklist -->
  <div class="checklist-widget" id="checklistWidget">
    <div class="checklist-widget__icon" id="checklistIcon">
      <i class="fa-regular fa-lightbulb"></i>
    </div>
    <div class="checklist-widget__panel" id="checklistPanel">
      <div class="checklist-widget__panel-header">
        <h4><i class="fa-regular fa-lightbulb"></i> Metas do Dia</h4>
        <button class="checklist-widget__close" id="checklistClose">&times;</button>
      </div>
      <div class="checklist-widget__list">
        <div class="checklist-widget__item">
          <input type="checkbox" id="ck1" disabled />
          <label for="ck1">Assista uma aula completa</label>
        </div>
        <div class="checklist-widget__item">
          <input type="checkbox" id="ck2" disabled />
          <label for="ck2">Baixe 1 material de apoio</label>
        </div>
        <div class="checklist-widget__item">
          <input type="checkbox" id="ck3" disabled />
          <label for="ck3">Responda ao fórum da aula</label>
        </div>
        <div class="checklist-widget__item">
          <input type="checkbox" id="ck4" disabled />
          <label for="ck4">Marque 1 curso como favorito</label>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
